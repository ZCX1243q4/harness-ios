workflows:
  ios-unsigned:
    name: Harness unsigned ipa
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        XCODE_SCHEME: Harness
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate project
        script: xcodegen generate
      - name: Build without signing
        script: |
          set -e
          xcodebuild build \
            -project Harness.xcodeproj \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package unsigned ipa
        script: |
          set -e
          chmod +x scripts/make-unsigned-ipa.sh
          ./scripts/make-unsigned-ipa.sh \
            "build/dd/Build/Products/Release-iphoneos/Harness.app" \
            Harness-unsigned.ipa
    artifacts:
      - Harness-unsigned.ipa
